<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
    #fsBtn {
      position: fixed;
      bottom: 50px;
      right: 16px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
    }
    #fsBtn:hover {
      background: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>

  <iframe 
    id="vdoFrame"
    src="https://vdo.ninja/?view=CC&cleanoutput&nocontrols&hideheader&nocursor"
    allow="autoplay; camera; microphone; fullscreen; picture-in-picture; display-capture"
    allowfullscreen>
  </iframe>

  <button id="fsBtn" title="Fullscreen">⛶</button>

  <script>
    const fsBtn = document.getElementById('fsBtn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  function toggleBrowserFullscreen() {
    const page = document.documentElement; // Targets the ENTIRE webpage/browser
    const btn = document.getElementById('browser-fs-btn');

    const isFullscreen = document.fullscreenElement || 
                         document.webkitFullscreenElement || 
                         document.mozFullScreenElement || 
                         document.msFullscreenElement;

    if (!isFullscreen) {
      if (page.requestFullscreen) {
        page.requestFullscreen();
      } else if (page.webkitRequestFullscreen) {
        page.webkitRequestFullscreen(); // Safari
      } else if (page.msRequestFullscreen) {
        page.msRequestFullscreen(); // Older Edge/IE
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen(); // Safari
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen(); // Older Edge/IE
      }
    }
  }

  // Automatically updates button text when entering/exiting fullscreen (including via ESC or F11)
  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(event => {
    document.addEventListener(event, () => {
      const btn = document.getElementById('browser-fs-btn');
      const isFullscreen = document.fullscreenElement || 
                           document.webkitFullscreenElement || 
                           document.mozFullScreenElement || 
                           document.msFullscreenElement;
      btn.textContent = isFullscreen ? '✕ Exit Browser Fullscreen' : '⛶ Fullscreen Browser';
    });
  });
</script>

</body>
</html>
